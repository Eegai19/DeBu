# Full stack: MongoDB + API + storefront.
#   docker compose up --build
#   docker compose exec api node server/dist/scripts/seed.js   # load the sample catalogue
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/debu
      CLIENT_ORIGIN: http://localhost:3000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-please-change-this-admin-key-now}
    ports:
      - '5000:5000'

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        # Baked into the browser bundle, so it must be reachable from the user's browser.
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  mongo-data:
